{% extends "base.html" %}
{% block title %}Log in - MyBank{% endblock %}
{% block content %}
<div class="centered-card">
  <h1 class="logo">MyBank</h1>
  <p class="subtitle">Welcome back, {{ account["full_name"] }}</p>

  <form method="POST" class="form">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required autofocus />

    <button type="submit" class="btn-primary">Log In</button>
  </form>

  <p class="hint">
    Not {{ account["full_name"] }}? <a href="{{ url_for('switch_account') }}">Use a different account</a>
  </p>
</div>
{% endblock %}
