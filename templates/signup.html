{% extends "base.html" %}
{% block title %}Open an account - MyBank{% endblock %}
{% block content %}
<div class="centered-card" style="margin-top: 6vh;">
  <h1 class="logo">MyBank</h1>
  <p class="subtitle">Open an account</p>

  <form method="POST" class="form" enctype="multipart/form-data">
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" value="{{ full_name }}" placeholder="Jane Doe" required autofocus />

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" name="phone" value="{{ phone }}" placeholder="+1 555 000 1111" required />

    <label for="id_document">Government ID (photo or PDF)</label>
    <input type="file" id="id_document" name="id_document" accept=".png,.jpg,.jpeg,.pdf" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" />

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6" />

    <button type="submit" class="btn-primary">Open Account</button>
  </form>

  <p class="hint">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
