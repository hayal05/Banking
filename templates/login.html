{% extends "base.html" %}
{% block title %}Log in - MyBank{% endblock %}
{% block content %}
<div class="centered-card">
  <h1 class="logo">MyBank</h1>
  <p class="subtitle">Enter your phone number to continue</p>

  <form method="POST" class="form">
    <label for="phone">Phone number</label>
    <input type="tel" id="phone" name="phone" placeholder="+1 555 000 1111" required autofocus />

    <button type="submit" class="btn-primary">Continue</button>
  </form>

  <p class="hint">
    New here? <a href="{{ url_for('signup') }}">Open an account</a>
  </p>
  <p class="hint">Demo account: <strong>+15550001111</strong> / <strong>demo123</strong></p>
</div>
{% endblock %}
